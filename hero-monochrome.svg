<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" width="100%" height="210">
  <defs>
    <linearGradient id="surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="50%" stop-color="#0E0E11" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <linearGradient id="titleMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F4F4F5" />
      <stop offset="100%" stop-color="#A1A1AA" />
    </linearGradient>

    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="ambientLight" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.055" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.85" fill="rgba(255,255,255,0.06)" />
    </pattern>

    <clipPath id="cardClip">
      <rect width="880" height="210" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Base Carbon Surface -->
    <rect width="880" height="210" rx="16" fill="url(#surface)" />
    <rect width="880" height="210" fill="url(#dots)" />
    <rect width="880" height="210" fill="url(#ambientLight)" />

    <!-- Subtle Animated Top Specular Shimmer Beam (Linear / Vercel style) -->
    <rect x="-260" y="0" width="260" height="1.5" fill="url(#beam)">
      <animate attributeName="x" values="-260;920" dur="6.5s" repeatCount="indefinite" />
    </rect>

    <!-- Minimal Name & Title -->
    <text x="48" y="96" fill="url(#titleMetal)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.9">
      Muhammad Sikandar Afzal
    </text>

    <text x="48" y="130" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="-0.1">
      Software Engineer — TypeScript, Next.js &amp; Full-Stack Architecture
    </text>

    <!-- Bottom Hairline Divider -->
    <line x1="48" y1="158" x2="832" y2="158" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

    <!-- Footer Metadata -->
    <text x="48" y="182" fill="#71717A" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="500" letter-spacing="0.4">
      INGOLSTADT, GERMANY
    </text>

    <g transform="translate(752, 178)">
      <circle cx="0" cy="-4" r="3" fill="#E4E4E7">
        <animate attributeName="opacity" values="0.9;0.25;0.9" dur="3s" repeatCount="indefinite" />
      </circle>
      <text x="12" y="0" fill="#71717A" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="500" letter-spacing="0.4">
        @sikander-afzaal
      </text>
    </g>
  </g>

  <!-- Precision 1px Border -->
  <rect x="0.5" y="0.5" width="879" height="209" rx="15.5" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
</svg>
